# All-in-One 一键部署（全自动零配置）
# 整合：rustdesk-console + rustdesk-console-web + rustdesk-server(hbbs/hbbr) + Caddy 反代
#
# 唯一启动命令：
#   bash bin/aio-up.sh
#
# 带域名（可选，自动 HTTPS / Let's Encrypt）：
#   bash bin/aio-up.sh -d rustdesk.example.com
#
# 停止：
#   bash bin/aio-down.sh
#
# 自动行为：
#   · 自动生成 JWT_SECRET / SERVER_MANAGEMENT_TOKEN
#   · 自动探测 PUBLIC_HOST（hostname -I）
#   · 自动生成 Caddyfile（有域名→LE；无域名→自签 HTTPS）
#   · 自动对接 Server Management + Web Client
#   · 自动等 hbbs 起来读公钥
#   · 自动启用网页远控（wss 或 ws，按场景降级）
#
# 端口：
#   80    Caddy HTTP → HTTPS 跳转 / 纯 HTTP
#   443   Caddy HTTPS → 反代 Console
#   21115 hbbs 注册（TCP）
#   21116 hbbs 心跳（TCP + UDP）
#   21117 hbbr 中继（TCP）
#   21120 hbbs 管理 API（仅容器内部）
#
# 说明：
#   · 21118 / 21119 的 WebSocket 端口**不再对外暴露**——Gateway 模式下
#     Caddy 反代 → Console Gateway 鉴权 → 内部直连 hbbs/hbbr，更安全
#   · 纯 RustDesk 客户端（非网页）直接用 hbbs 原生端口，仍然需要客户端
#     侧设置 relay address（首次部署后在 Console Settings 里填）

services:
  # ============ Caddy — 自动 HTTPS + 反代 ============
  # 纯文件驱动：aio-up.sh 会根据场景（有域名/裸 IP）生成 Caddyfile
  # 有域名 → 自动 Let's Encrypt + HTTP→HTTPS 跳转
  # 无域名 → tls internal 自签，浏览器首次访问点「继续访问」
  caddy:
    image: caddy:2-alpine
    container_name: rustdesk-caddy
    restart: unless-stopped
    ports:
      - '${CADDY_HTTP_PORT:-880}:80'
      - '${CADDY_HTTPS_PORT:-4443}:443'
    volumes:
      - ./deploy/Caddyfile.generated:/etc/caddy/Caddyfile:ro
      - ./data/certs:/etc/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - rustdesk-console-web
    networks:
      - rustdesk-aio

  # ============ RustDesk Console 后端 ============
  rustdesk-console:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CONSOLE_IMAGE:-rustdesk-console:aio}
    container_name: rustdesk-console
    restart: unless-stopped
    environment:
      # —— 以下空值会由 Dockerfile ENTRYPOINT 自动生成 ——
      # 如需手动覆盖，在启动前 export 或写进 secrets.env 后重新 aio-up.sh
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_MIGRATE_ON_START: ${DB_MIGRATE_ON_START:-1}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      # MySQL（DB_TYPE=mysql 时生效）
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-rustdesk_console}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_DATABASE: ${DB_DATABASE:-rustdesk_console}
      # —— 自动对接 RustDesk Server（同 compose 网络）——
      SERVER_MANAGEMENT_URL: ${SERVER_MANAGEMENT_URL:-http://hbbs:21120}
      SERVER_MANAGEMENT_TOKEN: ${SERVER_MANAGEMENT_TOKEN:-}
      SERVER_MANAGEMENT_NODE_ID: ${SERVER_MANAGEMENT_NODE_ID:-rustdesk}
      SERVER_MANAGEMENT_NODE_NAME: ${SERVER_MANAGEMENT_NODE_NAME:-RustDesk}
      # —— Web Client（网页远控）自动配置 ——
      # Console 后端会自动等待 hbbs 起来读公钥并填好 upstream URL；
      # 提供了 WEB_CLIENT_ORIGIN=https://... 时会自动启用网页远控。
      # 有反代时推荐同时提供 CONSOLE_PUBLIC_URL=https://你的域名
      DATA_DIR: ${CONSOLE_DATA_DIR:-/data}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      CONSOLE_PUBLIC_URL: ${CONSOLE_PUBLIC_URL:-}
      WEB_CLIENT_ORIGIN: ${WEB_CLIENT_ORIGIN:-}
      # 设为 1 时强制覆盖已有的 Web Client settings（哪怕不是占位符）
      FORCE_WEB_CLIENT_BOOTSTRAP: ${FORCE_WEB_CLIENT_BOOTSTRAP:-}
    volumes:
      - ${CONSOLE_DATA_DIR:-./data}:/data
    networks:
      - rustdesk-aio

  # ============ RustDesk Console Web 前端 ============
  # 不对外暴露端口 —— 只被 Caddy 反代（端口转发由 caddy 处理）
  rustdesk-console-web:
    image: databk/rustdesk-console-web:latest
    container_name: rustdesk-console-web
    restart: unless-stopped
    expose:
      - '80'
    environment:
      BACKEND_URL: http://rustdesk-console:3000
    depends_on:
      - rustdesk-console
    networks:
      - rustdesk-aio

  # ============ RustDesk Server — ID / 注册 / 心跳 ============
  hbbs:
    image: databk/rustdesk-server:latest
    container_name: hbbs
    restart: unless-stopped
    working_dir: /data
    command: ['hbbs']
    environment:
      HOME: /data
      # RD_MANAGEMENT_TOKEN 必须 ≥ 32 字符。
      # aio-up.sh 会预生成 secrets.env 后把值通过环境传进来；
      # 如果绕过 aio-up.sh 直接跑 compose，这个值可能为空 ——
      # hbbs 会在日志里提示 token 缺失后退出。
      RD_MANAGEMENT_BIND: 0.0.0.0:21120
      RD_MANAGEMENT_TOKEN: ${SERVER_MANAGEMENT_TOKEN:-}
      RD_MANAGEMENT_DIR: /data/management
      RD_RELAY_ADDRESS: ${RUSTDESK_RELAY_ADDRESS:-}
    ports:
      - '21115:21115'
      - '21116:21116'
      - '21116:21116/udp'
      # 21118 是 WebSocket ID 端口 —— Gateway 模式下 Caddy → Console 内部直连，
      # 不再对外暴露（让 Gateway 做鉴权 + 审计）
    expose:
      - '21118'
    volumes:
      - ${SERVER_DATA_DIR:-./data/server}:/data
    networks:
      - rustdesk-aio

  # ============ RustDesk Server — Relay / 中继 ============
  hbbr:
    image: databk/rustdesk-server:latest
    container_name: hbbr
    restart: unless-stopped
    working_dir: /data
    command: ['hbbr']
    environment:
      HOME: /data
      RD_HBBS_API_URL: ws://hbbs:21120/v1/control
      RD_MANAGEMENT_TOKEN: ${SERVER_MANAGEMENT_TOKEN:-}
      RD_RELAY_ID: ${HBBR_RELAY_ID:-relay-1}
      RD_RELAY_ADDRESS: ${RUSTDESK_RELAY_ADDRESS:-}
    ports:
      - '21117:21117'
      # 21119 是 WebSocket Relay 端口 —— Gateway 模式下不再对外暴露
    expose:
      - '21119'
    volumes:
      - ${RELAY_DATA_DIR:-./data/server-relay}:/data
    networks:
      - rustdesk-aio

networks:
  rustdesk-aio:
    name: rustdesk-aio
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
