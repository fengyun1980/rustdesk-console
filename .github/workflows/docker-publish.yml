name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - trae/agent-0sKjvb
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build (amd64) and optionally push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 有 secrets 就 push 到 Docker Hub；没有就 build 完 save artifact
      - name: Compute tags + login
        id: setup
        env:
          DU: ${{ secrets.DOCKER_USERNAME }}
          DT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DU" ] && [ -n "$DT" ]; then
            IMAGE="${DU}/rustdesk-console"
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "DOCKER_USERNAME=$DU" >> "$GITHUB_ENV"
            echo "DOCKERHUB_TOKEN=$DT" >> "$GITHUB_ENV"
          else
            IMAGE="rustdesk-console"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

          REF="${GITHUB_REF}"
          SHA7="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:sha-${SHA7}"
          [ "$REF" = "refs/heads/main" ] && TAGS="$TAGS
${IMAGE}:latest"
          [ "$REF" = "refs/heads/trae/agent-0sKjvb" ] && TAGS="$TAGS
${IMAGE}:aio"
          case "$REF" in
            refs/tags/v*)
              V="${GITHUB_REF_NAME#v}"; M="${V%.*}"
              TAGS="$TAGS
${IMAGE}:${V}
${IMAGE}:${M}
${IMAGE}:latest" ;;
          esac
          CLEAN=$(echo "$TAGS" | sed '/^[[:space:]]*$/d' | sort -u)
          { echo "tags<<EOF"; echo "$CLEAN"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "=== TAGS ==="; echo "$CLEAN"

      - name: Login to Docker Hub
        if: steps.setup.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.setup.outputs.push == 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.setup.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to artifact
        if: steps.setup.outputs.push != 'true'
        run: |
          docker save -o rustdesk-console-aio.tar rustdesk-console:aio
          ls -lh rustdesk-console-aio.tar

      - uses: actions/upload-artifact@v4
        if: steps.setup.outputs.push != 'true'
        with:
          name: rustdesk-console-aio-amd64
          path: rustdesk-console-aio.tar
          retention-days: 7
