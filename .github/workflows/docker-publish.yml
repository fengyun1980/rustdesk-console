name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - trae/agent-0sKjvb
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:build
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push main branch tags
        if: github.ref == 'refs/heads/main'
        run: |
          set -ex
          IMAGE=ghcr.io/${{ github.repository }}
          docker buildx imagetools push "$IMAGE:build"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:build"
          docker buildx imagetools create -t "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:build"

      - name: Push AIO branch tags
        if: github.ref == 'refs/heads/trae/agent-0sKjvb'
        run: |
          set -ex
          IMAGE=ghcr.io/${{ github.repository }}
          docker buildx imagetools push "$IMAGE:build"
          docker buildx imagetools create -t "$IMAGE:aio" "$IMAGE:build"
          docker buildx imagetools create -t "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:build"

      - name: Push version tag (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -ex
          IMAGE=ghcr.io/${{ github.repository }}
          docker buildx imagetools push "$IMAGE:build"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:build"
          docker buildx imagetools create -t "$IMAGE:${GITHUB_REF_NAME#v}" "$IMAGE:build"
          docker buildx imagetools create -t "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:build"

      - name: Clean up temp tag
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker buildx imagetools rm "$IMAGE:build" || true
