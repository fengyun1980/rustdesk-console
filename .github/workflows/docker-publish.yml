name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - trae/agent-0sKjvb
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          SHA7="${GITHUB_SHA::7}"
          TAGS_LIST="
            ${IMAGE}:sha-${SHA7}
          "
          REF="${GITHUB_REF}"
          if [ "$REF" = "refs/heads/main" ]; then
            TAGS_LIST="
              ${TAGS_LIST}
              ${IMAGE}:latest
              ${IMAGE}:main
            "
          fi
          if [ "$REF" = "refs/heads/trae/agent-0sKjvb" ]; then
            TAGS_LIST="
              ${TAGS_LIST}
              ${IMAGE}:aio
            "
          fi
          case "$REF" in
            refs/tags/v*)
              VER="${GITHUB_REF_NAME#v}"
              MINOR="${VER%.*}"
              TAGS_LIST="
                ${TAGS_LIST}
                ${IMAGE}:${VER}
                ${IMAGE}:${MINOR}
                ${IMAGE}:latest
              "
              ;;
          esac
          # 清理：去空行去重
          CLEAN=$(echo "$TAGS_LIST" | sed '/^[[:space:]]*$/d' | sed 's/^[[:space:]]*//' | sort -u)
          {
            echo "tags<<GHAEOF"
            echo "$CLEAN"
            echo "GHAEOF"
          } >> "$GITHUB_OUTPUT"
          echo "=== Will push these tags ==="
          echo "$CLEAN"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
