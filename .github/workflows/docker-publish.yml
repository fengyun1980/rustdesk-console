name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - trae/agent-0sKjvb
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先构建到本地（不 push），拿到 digest
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository }}:buildcache
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 用 buildx build --push 一次性推送所有需要的 tag
      - name: Push to GHCR
        run: |
          set -ex
          IMAGE=ghcr.io/${{ github.repository }}
          SHA_SHORT=${GITHUB_SHA::7}

          TAGS=()
          TAGS+=("--tag" "${IMAGE}:sha-${SHA_SHORT}")

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS+=("--tag" "${IMAGE}:latest")
            TAGS+=("--tag" "${IMAGE}:main")
          fi

          if [ "${GITHUB_REF}" = "refs/heads/trae/agent-0sKjvb" ]; then
            TAGS+=("--tag" "${IMAGE}:aio")
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS+=("--tag" "${IMAGE}:latest")
            TAGS+=("--tag" "${IMAGE}:${VERSION}")
            MINOR="${VERSION%.*}"
            TAGS+=("--tag" "${IMAGE}:${MINOR}")
          fi

          # 用 buildx 重新 build 并 push（多架构 + 多 tag）
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${TAGS[@]}" \
            --build-arg "APP_VERSION=${GITHUB_REF_NAME}" \
            --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" \
            --push \
            .
