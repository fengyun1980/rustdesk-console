name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - trae/agent-0sKjvb
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action v5 — tags 格式：
      #   type=sha              → ghcr.io/org/repo:sha-xxxxxxxxxxxx
      #   type=ref,event=branch → 自动匹配 branch push，value=branch 名
      #   type=ref,event=tag    → 自动匹配 tag push
      #   type=raw              → 自定义 tag
      #   type=semver           → 自动匹配 v* tag
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Override aio tag for trae branch
        id: final-tags
        run: |
          CURRENT_TAGS="${{ steps.meta.outputs.tags }}"
          if [ "${{ github.ref }}" = "refs/heads/trae/agent-0sKjvb" ]; then
            CURRENT_TAGS="${CURRENT_TAGS}
ghcr.io/${{ github.repository }}:aio"
          fi
          # 去重、去空行
          CURRENT_TAGS=$(echo "$CURRENT_TAGS" | sed '/^$/d' | sort -u)
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CURRENT_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "=== Final tags ==="
          echo "$CURRENT_TAGS"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.final-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
