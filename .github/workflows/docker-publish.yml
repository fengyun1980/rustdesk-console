name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - trae/agent-0sKjvb
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 让 buildx 能直接从 meta 的 needs 拿到 IMAGE 名
env:
  DU: ${{ secrets.DOCKER_USERNAME }}
  DT: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  meta:
    name: Compute image metadata
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      push: ${{ steps.meta.outputs.push }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - id: meta
        run: |
          set -ex
          if [ -n "$DU" ] && [ -n "$DT" ]; then
            IMAGE="${DU}/rustdesk-console"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            IMAGE="rustdesk-console"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          REF="${GITHUB_REF}"
          SHA7="${GITHUB_SHA::7}"
          {
            echo "tags<<GHAEOF"
            echo "${IMAGE}:sha-${SHA7}"
            if [ "$REF" = "refs/heads/main" ]; then
              echo "${IMAGE}:latest"
            fi
            if [ "$REF" = "refs/heads/trae/agent-0sKjvb" ]; then
              echo "${IMAGE}:aio"
            fi
            case "$REF" in
              refs/tags/v*)
                V="${GITHUB_REF_NAME#v}"; M="${V%.*}"
                echo "${IMAGE}:${V}"
                echo "${IMAGE}:${M}"
                echo "${IMAGE}:latest"
                ;;
            esac
            echo "GHAEOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    name: Build ${{ matrix.arch }} ${{ needs.meta.outputs.push == 'true' && '& push' || '(no push)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: needs.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ needs.meta.outputs.push == 'true' }}
          platforms: ${{ matrix.platform }}
          tags: ${{ needs.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: ${{ needs.meta.outputs.push == 'true' && 'type=registry' || 'type=docker' }}

      - name: Save artifact (no push)
        if: needs.meta.outputs.push != 'true'
        run: |
          docker save -o rustdesk-console-${{ matrix.arch }}.tar ${{ needs.meta.outputs.image }}:aio
          ls -lh rustdesk-console-${{ matrix.arch }}.tar

      - uses: actions/upload-artifact@v4
        if: needs.meta.outputs.push != 'true'
        with:
          name: rustdesk-console-aio-${{ matrix.arch }}
          path: rustdesk-console-${{ matrix.arch }}.tar
          retention-days: 7
