name: Docker Build & Publish

on:
  push:
    branches:
      - main
      - trae/agent-0sKjvb
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build (amd64) and optionally push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: setup
        env:
          DU: ${{ secrets.DOCKER_USERNAME }}
          DT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -ex
          if [ -n "$DU" ] && [ -n "$DT" ]; then
            IMAGE="${DU}/rustdesk-console"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            IMAGE="rustdesk-console"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          REF="${GITHUB_REF}"
          SHA7="${GITHUB_SHA::7}"
          {
            echo "tags<<GHAEOF"
            echo "${IMAGE}:sha-${SHA7}"
            if [ "$REF" = "refs/heads/main" ]; then
              echo "${IMAGE}:latest"
            fi
            if [ "$REF" = "refs/heads/trae/agent-0sKjvb" ]; then
              echo "${IMAGE}:aio"
            fi
            case "$REF" in
              refs/tags/v*)
                V="${GITHUB_REF_NAME#v}"; M="${V%.*}"
                echo "${IMAGE}:${V}"
                echo "${IMAGE}:${M}"
                echo "${IMAGE}:latest"
                ;;
            esac
            echo "GHAEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: steps.setup.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.setup.outputs.push == 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.setup.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: ${{ steps.setup.outputs.push == 'true' && 'type=registry' || 'type=docker' }}

      - name: Save artifact (no push)
        if: steps.setup.outputs.push != 'true'
        run: |
          docker save -o rustdesk-console-aio.tar rustdesk-console:aio
          ls -lh rustdesk-console-aio.tar

      - uses: actions/upload-artifact@v4
        if: steps.setup.outputs.push != 'true'
        with:
          name: rustdesk-console-aio-amd64
          path: rustdesk-console-aio.tar
          retention-days: 7
